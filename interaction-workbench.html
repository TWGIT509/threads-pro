<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THREADS PRO V3.1｜互動工作台</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#182033;--muted:#778198;--line:#e6e9f0;--purple:#6558e8;--green:#16865b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,"Noto Sans TC",sans-serif}header{background:#111520;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:auto;padding:24px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}textarea{min-height:110px}button{border:0;border-radius:8px;padding:10px 14px;background:var(--purple);color:white;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}button.secondary{background:#eeeefe;color:#5046b8}button.ghost{background:white;border:1px solid var(--line);color:#394258}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.draft{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}.tag{font-size:11px;padding:4px 8px;border-radius:20px;background:#f0efff;color:#5548c8}.good{color:var(--green)}.warn{background:#fff7e8;padding:12px;border-radius:9px;color:#805d1b;font-size:12px}.hide{display:none}.comment{border:1px solid var(--line);border-radius:8px;padding:10px;margin:7px 0;cursor:pointer}.comment.selected{border:2px solid var(--purple);background:#f7f6ff}.status{font-size:11px;color:#586278}@media(max-width:700px){main{padding:12px}.grid{grid-template-columns:1fr}header{padding:14px}}
.embed-preview{margin-top:10px;padding:12px;border:1px dashed var(--line);border-radius:10px;background:#fafbff}.embed-note{font-size:12px;color:var(--muted);margin-bottom:8px}
.destination-links{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.destination-links a{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#5146c8;text-decoration:none;font-weight:700}
.destination-links a:hover{background:#f4f2ff;border-color:var(--purple);text-decoration:underline}
.destination-links .destination-label{font-size:12px;color:var(--muted);align-self:center}

</style></head><body>
<header><div><b>THREADS PRO V3.1</b><div style="font-size:11px;color:#b8bfd0">人工審核互動工作台</div></div><a href="./index.html" style="color:white">返回 V3.0 後台</a></header>
<main>
<div class="warn">目前無官方發布 API 模式：系統負責分析、匹配及生成草稿；每篇必須人工審核，複製評論並在 Threads 原貼文手動發布。系統的「記錄已發布」只記錄你的回報，不會驗證 Threads 是否真的出現留言。</div>
<section class="panel"><h2>① 連線狀態</h2><div id="connection" class="muted">讀取連線設定中…</div><button class="secondary" id="reload">重新檢查連線</button></section>
<section class="panel"><h2>② 匯入 Threads 貼文</h2><p class="muted">一行一個公開貼文網址；貼文全文可在下方輸入。批量網址若每篇文字不同，請逐篇匯入或使用每篇獨立工作項目。僅貼網址在無讀取 API 時不會自動取得貼文全文。</p>
<label>貼文網址（每行一篇，最多 30 篇）</label><textarea id="urls" placeholder="https://www.threads.net/@account/post/xxxxx"></textarea>
<label>貼文全文（目前批次共用；內容不適用於所有貼文時請逐篇處理）</label><textarea id="postText" placeholder="貼上原貼文完整文字，避免系統猜測或虛構內容"></textarea>
<div class="row"><button id="prepare">分析並生成評論草稿</button><button class="ghost" id="clear">清空</button></div><div id="importResult" class="status"></div></section>
<section class="panel"><div class="row" style="align-items:center"><div><h2>③ 逐篇審核與發布</h2><div class="muted">每篇先選擇評論，再批准；批准後才能複製及記錄人工發布。</div></div><button class="ghost" id="refresh">重新載入清單</button></div><div id="drafts" class="muted">尚未載入。</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let sb=null,user=null,role=null;const $=id=>document.getElementById(id);const cfg=JSON.parse(localStorage.getItem('threadspro_cfg')||'{}');
function status(t){$('connection').textContent=t}
async function connect(){if(!cfg.url||!cfg.key){status('尚未找到 V3.0 的 Supabase URL / anon key。請先回 V3.0「連線設定」完成設定。');return false}
sb=window.supabase.createClient(cfg.url,cfg.key);const {data,error}=await sb.auth.getSession();if(error||!data.session){status('Supabase 已設定，但尚未登入。請先回 V3.0 使用管理員登入。');return false}
user=data.session.user;const {data:p}=await sb.from('profiles').select('role').eq('id',user.id).single();role=p?.role;status(role==='admin'?'已登入管理員：'+(user.email||user.id):'已登入，但 profiles.role 不是 admin；AI 操作會被拒絕。');return role==='admin'}
async function invoke(name,body){const {data:{session}}=await sb.auth.getSession();if(!session?.access_token)throw Error('登入已失效，請重新登入');const r=await fetch(cfg.url.replace(/\/$/,'')+'/functions/v1/'+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.key,'Authorization':'Bearer '+session.access_token},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||'服務錯誤 '+r.status);return d}
async function prepare(){if(!await connect())return;const urls=$('urls').value.split(/\s+/).map(x=>x.trim()).filter(Boolean);const text=$('postText').value.trim();if(!urls.length||urls.length>30||!text){$('importResult').textContent='請輸入 1～30 個網址及貼文全文。';return}
$('prepare').disabled=true;$('importResult').textContent='正在分析…';let ok=0,errors=[];
for(const postUrl of urls){try{await invoke('prepare-interaction',{postUrl,postText:text});ok++}catch(e){errors.push(postUrl+'：'+e.message)}}
$('importResult').textContent='完成 '+ok+' 篇；失敗 '+errors.length+' 篇。'+errors.join(' | ');$('prepare').disabled=false;await loadDrafts()}
async function writeLog(draftId, action, detail={}) {
  // Logging is best-effort: a logging failure must never undo an approval.
  try {
    const { error } = await sb.from('interaction_logs').insert({
      user_id: user.id,
      draft_id: draftId,
      action,
      detail
    });
    if (error) console.warn('Interaction log was not saved:', error.message);
    return !error;
  } catch (e) {
    console.warn('Interaction log was not saved:', e);
    return false;
  }
}

async function loadDrafts() {
  const refreshButton = $('refresh');
  if (refreshButton) refreshButton.disabled = true;
  $('drafts').textContent = '正在重新載入清單…';
  try {
    if (!await connect()) {
      $('drafts').textContent = '尚未登入管理員。請先回 V3.1 主控台完成 Supabase 管理員登入。';
      return;
    }
    const { data, error } = await sb
      .from('interaction_drafts')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(100);

    if (error) throw error;

    $('drafts').innerHTML = (data || []).map(d => `
      <article class="draft" data-id="${escapeHtml(d.id)}">
        <div class="row">
          <div>
            <b>${escapeHtml(d.detected_category || '未分類')}</b>
            <span class="tag">${escapeHtml(d.review_status || '待審核')}</span>
            <div class="muted">相關性 ${Number(d.relevance_score || 0)} 分 · ${d.created_at ? new Date(d.created_at).toLocaleString() : ''}</div>
          </div>
          <a href="${safeUrl(d.post_url)}" target="_blank" rel="noopener">開啟原貼文 ↗</a>
        </div>
        <p>${escapeHtml((d.post_text || '').slice(0, 500))}</p>
        <div class="muted">匹配活動：${d.campaign_id ? '已匹配' : '待人工分配'} · 活動頁：${d.landing_page_url ? '已設定' : '未設定'} · LINE：${d.line_url ? '已設定' : '未設定'}</div>
        <div class="destination-links">
          ${safeExternalUrl(d.landing_page_url) ? '<a href="' + escapeHtml(safeExternalUrl(d.landing_page_url)) + '" target="_blank" rel="noopener noreferrer">開啟活動頁 ↗</a>' : ''}
          ${safeExternalUrl(d.line_url) ? '<a href="' + escapeHtml(safeExternalUrl(d.line_url)) + '" target="_blank" rel="noopener noreferrer">開啟 LINE 客服 ↗</a>' : ''}
          ${!safeExternalUrl(d.landing_page_url) && !safeExternalUrl(d.line_url) ? '<span class="destination-label">尚未設定可開啟的活動頁或 LINE 連結</span>' : ''}
        </div>
        <label>選擇評論草稿</label>
        ${(Array.isArray(d.comments) ? d.comments : []).map((c, i) => `
          <div class="comment ${d.selected_comment === c ? 'selected' : ''}" data-comment="${encodeURIComponent(String(c))}" data-index="${i}">${escapeHtml(c)}</div>
        `).join('')}
        <div class="row">
          <button class="secondary approve" type="button">批准所選評論</button>
          <button class="ghost copy" type="button">複製所選評論</button>
          <button class="ghost open" type="button">開啟原貼文</button>
          <button class="ghost preview" type="button">免登入預覽公開貼文</button>
          <button class="ghost published" type="button">記錄人工發布</button>
          <button class="ghost reject" type="button">拒絕</button>
        </div>
        <div class="embed-preview hide"></div>
        <div class="muted action-message" aria-live="polite"></div>
      </article>
    `).join('') || '<div class="muted">目前沒有評論草稿。</div>';

    document.querySelectorAll('.draft').forEach(el => {
      const id = el.dataset.id;
      let selected = '';
      let selectedPersisted = true;
      const selectedNode = el.querySelector('.comment.selected');
      if (selectedNode) {
        try { selected = decodeURIComponent(selectedNode.dataset.comment || ''); }
        catch { selected = selectedNode.textContent || ''; }
      }

      const message = text => {
        const node = el.querySelector('.action-message');
        if (node) node.textContent = text;
      };

      el.querySelectorAll('.comment').forEach(c => {
        c.addEventListener('click', async () => {
          try {
            selected = decodeURIComponent(c.dataset.comment || '');
            selectedPersisted = false;
            el.querySelector('.approve').disabled = true;
            el.querySelectorAll('.comment').forEach(x => x.classList.remove('selected'));
            c.classList.add('selected');
            const { error } = await sb.from('interaction_drafts')
              .update({ selected_comment: selected })
              .eq('id', id)
              .eq('user_id', user.id);
            if (error) throw error;
            selectedPersisted = true;
            el.querySelector('.approve').disabled = false;
            message('已選取評論並儲存。');
          } catch (e) {
            message('選取儲存失敗：' + (e.message || e));
          }
        });
      });

      el.querySelector('.approve').addEventListener('click', async () => {
        if (!selected || !selectedPersisted) {
          message('請先選擇評論並等待選取內容儲存完成。');
          return;
        }
        const btn = el.querySelector('.approve');
        btn.disabled = true;
        try {
          // State transitions go through the admin-checked Edge Function.
          // selected_comment is persisted by the selection handler before this action.
          const result = await invoke('record-interaction-action', {
            draftId: id,
            action: 'approve'
          });
          if (!result?.success) throw new Error(result?.error || '批准未成功');
          message('已批准。現在可以複製評論並到 Threads 手動發布。');
          await loadDrafts();
        } catch (e) {
          message('批准失敗：' + (e.message || e));
          btn.disabled = false;
        }
      });

      el.querySelector('.copy').addEventListener('click', async () => {
        // Always read the one visibly selected comment in THIS post card.
        // Never copy all drafts, nor reuse a selection from another post.
        const currentStatus = el.querySelector('.tag')?.textContent || '';
        const selectedNode = el.querySelector('.comment.selected');
        const oneComment = selectedNode ? selectedNode.textContent.trim() : '';
        if (!oneComment) {
          message('請先在這篇貼文下方點選一則評論。');
          return;
        }
        if (!currentStatus.includes('已批准')) {
          message('請先批准這篇貼文所選的評論，再複製。');
          return;
        }
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(oneComment);
          } else {
            const temp = document.createElement('textarea');
            temp.value = oneComment;
            temp.style.position = 'fixed';
            temp.style.opacity = '0';
            document.body.appendChild(temp);
            temp.select();
            const ok = document.execCommand('copy');
            temp.remove();
            if (!ok) throw new Error('瀏覽器不允許複製，請手動選取文字。');
          }
          await writeLog(id, 'copied', { selected_comment: oneComment });
          message('已複製目前選取的單則評論。');
        } catch (e) {
          message('複製失敗：' + (e.message || e));
        }
      });

      el.querySelector('.open').addEventListener('click', () => {
        const link = el.querySelector('a');
        if (link && link.href !== '#') {
          window.open(link.href, '_blank', 'noopener');
          writeLog(id, 'opened', { post_url: link.href });
        } else message('原貼文網址無效或不受支援。');
      });
      el.querySelector('.preview').addEventListener('click', () => {
        const link = el.querySelector('a');
        const preview = el.querySelector('.embed-preview');
        if (!link || link.href === '#') { message('原貼文網址無效或不受支援。'); return; }
        preview.classList.remove('hide');
        preview.innerHTML = '';
        const note = document.createElement('div');
        note.className = 'embed-note';
        note.textContent = 'Threads 官方公開貼文嵌入預覽。只有公開且允許嵌入的貼文可能免登入顯示；私人貼文、部分分享短網址或平台限制可能無法顯示。此功能不會繞過 Threads 登入限制。';
        preview.appendChild(note);
        const quote = document.createElement('blockquote');
        quote.className = 'text-post-media';
        quote.setAttribute('data-text-post-permalink', link.href);
        quote.setAttribute('data-text-post-version', '0');
        const a = document.createElement('a'); a.href = link.href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '在 Threads 查看原始貼文';
        quote.appendChild(a); preview.appendChild(quote);
        const script = document.createElement('script'); script.async = true; script.src = 'https://www.threads.net/embed.js';
        script.onerror = () => { note.textContent = 'Threads 官方嵌入載入失敗。可改用「開啟原貼文」；是否需要登入由 Threads 決定。'; };
        preview.appendChild(script);
        message('已載入公開貼文預覽；若未顯示，可能是貼文類型或 Threads 的登入限制。');
      });

      el.querySelector('.published').addEventListener('click', async () => {
        if (!selected || !selectedPersisted) {
          message('請先選擇評論並等待選取內容儲存完成。');
          return;
        }
        if (!(el.querySelector('.tag')?.textContent || '').includes('已批准')) {
          message('必須先批准評論，才能記錄人工發布。');
          return;
        }
        if (!confirm('請確認你已在 Threads 原貼文成功發布此評論。系統只記錄你的確認，不會自行驗證。')) return;
        try {
          const result = await invoke('record-interaction-action', {
            draftId: id,
            action: 'manual_published'
          });
          if (!result?.success) throw new Error(result?.error || '發布紀錄未成功');
          await loadDrafts();
        } catch (e) {
          message('記錄發布失敗：' + (e.message || e));
        }
      });

      el.querySelector('.reject').addEventListener('click', async () => {
        if (!confirm('確定拒絕這篇評論草稿？')) return;
        try {
          const result = await invoke('record-interaction-action', {
            draftId: id,
            action: 'reject'
          });
          if (!result?.success) throw new Error(result?.error || '拒絕操作未成功');
          await loadDrafts();
        } catch (e) {
          message('拒絕失敗：' + (e.message || e));
        }
      });
    });
  } catch (e) {
    $('drafts').textContent = '載入失敗：' + (e.message || e);
  } finally {
    if (refreshButton) refreshButton.disabled = false;
  }
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function safeUrl(u) {
  try {
    const x = new URL(u);
    return x.protocol === 'https:' &&
      ['threads.net','www.threads.net','threads.com','www.threads.com'].includes(x.hostname)
      ? x.href : '#';
  } catch { return '#'; }
}
function safeExternalUrl(u) {
  try {
    const x = new URL(String(u || '').trim());
    return x.protocol === 'https:' ? x.href : '';
  } catch { return ''; }
}

$('reload').addEventListener('click', async () => {
  try {
    const ok = await connect();
    if (ok) await loadDrafts();
    else $('drafts').textContent = '尚未登入管理員，請先回主控台登入。';
  } catch (e) {
    $('drafts').textContent = '重新檢查連線失敗：' + (e.message || e);
  }
});
$('refresh').addEventListener('click', loadDrafts);
$('prepare').addEventListener('click', prepare);
$('clear').addEventListener('click', () => {
  $('urls').value = '';
  $('postText').value = '';
  $('importResult').textContent = '';
});
connect().then(ok => { if (ok) loadDrafts(); }).catch(e => status('連線錯誤：' + (e.message || e)));

</script></body></html>
